name: Release

# Run by hand: Actions tab -> Release -> Run workflow, or
#   gh workflow run release.yml -f bump=minor
# It bumps the version, commits and tags it on main as github-actions[bot],
# creates the GitHub release, then publishes to npm and the Homebrew tap and
# installs from both to verify. Everything runs in this one workflow because
# pushes and tags made with GITHUB_TOKEN trigger no other workflow.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false # never cache in release builds
      - run: npm ci
      - id: bump
        name: Bump the version in package.json and bin/pullr
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          version="$(npm version "$BUMP" --no-git-tag-version)"
          version="${version#v}"
          sed -i -E "s/^VERSION=\"[^\"]*\"/VERSION=\"$version\"/" bin/pullr
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "tag=v$version" >>"$GITHUB_OUTPUT"
      - run: shellcheck bin/pullr
      - run: npm test
      - name: Commit, tag and push
        env:
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "release $TAG"
          git tag -a "$TAG" -m "$TAG"
          git push --atomic origin HEAD:main "$TAG"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes

  npm:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false # never cache in release builds
          registry-url: https://registry.npmjs.org
      # Trusted publishing: npm accepts this job's OIDC token because the
      # package trusts kova1max/pullr + release.yml (set up with `npm trust`).
      - run: npm publish
      # npm processes a new version for a few minutes before serving it
      # (3.5 minutes for 0.4.0), so poll for up to 10.
      - name: Verify the published package runs
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          out=""
          for _ in $(seq 40); do
            out="$(npx -y "@kova1/pullr@$VERSION" --version 2>/dev/null)" && break
            sleep 15
          done
          test "$out" = "pullr $VERSION"

  github-packages:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false # never cache in release builds
          registry-url: https://npm.pkg.github.com
          scope: "@kova1max"
      # GitHub Packages only accepts packages scoped to the repo owner, so the
      # mirror is published as @kova1max/pullr while npmjs.org keeps @kova1/pullr.
      # The tarball contents are otherwise identical.
      - run: npm pkg set name=@kova1max/pullr
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - name: Verify the mirrored package is visible
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: test "$(npm view "@kova1max/pullr@$VERSION" version)" = "$VERSION"

  homebrew:
    needs: release
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: kova1max/homebrew-tap
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}
      - name: Point the formula at the new tag
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          url="https://github.com/kova1max/pullr/archive/refs/tags/$TAG.tar.gz"
          sha="$(curl -fsSL "$url" | sha256sum | cut -d' ' -f1)"
          sed -i -E \
            -e "s|^  url \".*\"|  url \"$url\"|" \
            -e "s|^  sha256 \".*\"|  sha256 \"$sha\"|" \
            Formula/pullr.rb
          git diff --exit-code --quiet && { echo "Formula already at $TAG"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "pullr ${TAG#v}"
          git push

  verify-homebrew:
    needs: [release, homebrew]
    runs-on: macos-latest
    permissions: {}
    steps:
      - name: Install from the tap and run the formula test
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          brew install kova1max/tap/pullr
          brew test kova1max/tap/pullr
          test "$(pullr --version)" = "pullr $VERSION"
