name: Feature request
description: Suggest an option or behaviour
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that pullr makes hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How it could work. pullr aims to stay one dependency-free bash script that is safe by default - see "What it will never do" in the README.
